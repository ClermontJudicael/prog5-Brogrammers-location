# Nom de l'application
spring.application.name=location

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/locationdb
spring.datasource.username=crud_user
spring.datasource.password=crud_password_psql
spring.datasource.driver-class-name=org.postgresql.Driver

# Exécuter automatiquement schema.sql et data.sql
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.profiles.active=prod
